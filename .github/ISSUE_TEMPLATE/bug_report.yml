name: Bug report
description: Something does not work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Before you paste logs or screenshots:** remove IP addresses, passwords,
        tokens, serial numbers, e-mail addresses and room or device names.
        This issue is public.
  - type: input
    id: version
    attributes:
      label: QuickApp version
      description: Shown in the first log line after the QuickApp starts
      placeholder: "1.2.0"
    validations:
      required: true
  - type: dropdown
    id: controller
    attributes:
      label: Controller
      options:
        - Home Center 3
        - Home Center 3 Lite
        - Yubii Home
        - Other
    validations:
      required: true
  - type: input
    id: firmware
    attributes:
      label: Controller firmware
      placeholder: "5.220.11"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
  - type: textarea
    id: log
    attributes:
      label: Log excerpt
      description: >-
        Set logLevel = "debug" in App.OPTIONS (QuickApp editor, file App) and save, reproduce the
        problem, then copy everything from the line "... starting on ..." up to
        the problem. Include any "QuickApp crashed" lines.
      render: text
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed addresses, credentials and personal names from everything above.
          required: true
